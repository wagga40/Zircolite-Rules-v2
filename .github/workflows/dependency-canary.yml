name: Dependency canary

# Resolves the newest dependencies allowed by the resolution overrides,
# regenerates the published source revisions with them, and reports what would
# change. A control run with the locked dependencies at the same revisions is
# the comparison baseline, so exclusion or code changes made since the release
# are not reported as effects of the upgrade. When nothing it checks changes,
# it proposes the upgrade as a pull request; it never commits to main.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-canary
  cancel-in-progress: true

jobs:
  # Runs newly published, unreviewed packages, so it holds no write permission.
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      attention: ${{ steps.summary.outputs.attention }}
      upgrade: ${{ steps.summary.outputs.upgrade }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: '3.14'
          version: '2.29.2'

      - name: Install the locked dependencies
        id: locked
        continue-on-error: true
        run: pdm sync --no-self

      # Exit 3 means some sources failed; the comparisons below show which.
      - name: Regenerate the published revisions as a control
        id: control
        if: steps.locked.outcome == 'success'
        continue-on-error: true
        run: >-
          pdm run python gen_ruleset.py --revisions-from release-manifest.json
          --output-dir "$RUNNER_TEMP/control" || [ $? = 3 ]

      - name: Resolve the newest dependencies
        id: resolve
        continue-on-error: true
        run: |
          cp pyproject.toml "$RUNNER_TEMP/pyproject.toml"
          pdm update --unconstrained --update-all --no-sync 2>&1 | tee "$RUNNER_TEMP/resolve.log"
          cp pdm.lock "$RUNNER_TEMP/resolved.lock"

      - name: Install the resolved dependencies
        id: install
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        run: pdm sync --no-self -G test --clean

      - name: Compare converter versions
        id: versions
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pdm run python dependency_canary.py --exit-code > "$RUNNER_TEMP/versions.md"

      - name: Test with the resolved dependencies
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pdm run pytest -q

      - name: Regenerate the published revisions
        id: generate
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: >-
          pdm run python gen_ruleset.py --revisions-from release-manifest.json
          --output-dir "$RUNNER_TEMP/candidate" || [ $? = 3 ]

      - name: Review exclusions against the new reports
        id: exclusions
        if: steps.install.outcome == 'success' && steps.generate.outcome != 'skipped'
        continue-on-error: true
        env:
          CONTROL: ${{ steps.control.outcome }}
        run: |
          control=()
          if [ "$CONTROL" = success ]; then control=(--control "$RUNNER_TEMP/control/reports"); fi
          pdm run python exclusion_baseline.py "$RUNNER_TEMP/candidate/reports" "${control[@]}" --exit-code \
            > "$RUNNER_TEMP/exclusions.md"

      - name: Compare rulesets with the control
        id: diff
        if: steps.install.outcome == 'success' && steps.generate.outcome != 'skipped'
        continue-on-error: true
        env:
          CONTROL: ${{ steps.control.outcome }}
        run: |
          baseline=.
          if [ "$CONTROL" = success ]; then baseline="$RUNNER_TEMP/control"; fi
          pdm run python ruleset_diff.py "$baseline" "$RUNNER_TEMP/candidate" --exit-code > "$RUNNER_TEMP/diff.md"

      # --unconstrained also rewrote pyproject.toml. The proposal is the original
      # with only its exact pins moved, relocked; it must lock exactly what was tested.
      - name: Propose the upgrade
        id: propose
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/upgrade"
          python3 -I dependency_upgrade.py --propose "$RUNNER_TEMP/pyproject.toml" > "$RUNNER_TEMP/upgrade/pyproject.toml"
          cp "$RUNNER_TEMP/upgrade/pyproject.toml" pyproject.toml
          pdm lock --update-reuse
          cp pdm.lock "$RUNNER_TEMP/upgrade/pdm.lock"
          python3 -I dependency_upgrade.py --same-versions "$RUNNER_TEMP/resolved.lock" pdm.lock
          if git diff --quiet HEAD -- pyproject.toml pdm.lock; then echo changed=no; else echo changed=yes; fi >> "$GITHUB_OUTPUT"

      - name: Summarize
        id: summary
        if: always()
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOCKED: ${{ steps.locked.outcome }}
          CONTROL: ${{ steps.control.outcome }}
          RESOLVE: ${{ steps.resolve.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          VERSIONS: ${{ steps.versions.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          GENERATE: ${{ steps.generate.outcome }}
          EXCLUSIONS: ${{ steps.exclusions.outcome }}
          DIFF: ${{ steps.diff.outcome }}
          PROPOSE: ${{ steps.propose.outcome }}
          CHANGED: ${{ steps.propose.outputs.changed }}
        run: |
          mkdir -p "$RUNNER_TEMP/canary"
          report="$RUNNER_TEMP/canary/report.md"
          attention=no
          # A drop-in upgrade: everything but the version comparison passed, and
          # the versions differ. The versions step fails for any upgrade.
          upgrade=$([ "$CHANGED" = yes ] && echo yes || echo no)
          {
            echo "# Dependency canary"
            echo
            echo "[Run]($RUN_URL). A *failure* outcome for versions, exclusions, or ruleset diff means something changed or needs review."
            if [ "$CONTROL" = success ]; then
              echo "Exclusions and rules are compared with the control run of the locked dependencies."
            else
              echo "The control run failed, so exclusions and rules are compared with the published release instead."
            fi
            echo
            echo "| Step | Outcome |"
            echo "|---|---|"
            for step in LOCKED CONTROL RESOLVE INSTALL VERSIONS TESTS GENERATE EXCLUSIONS DIFF PROPOSE; do
              echo "| ${step,,} | ${!step:-skipped} |"
              if [ "${!step}" = failure ]; then attention=yes; fi
              if [ "$step" != VERSIONS ] && [ "${!step}" != success ]; then upgrade=no; fi
            done
            # Both generations accept failed sources, which leave nothing to compare.
            uncompared=$(for run in control candidate; do
                manifest="$RUNNER_TEMP/$run/release-manifest.json"
                if [ -f "$manifest" ]; then
                  jq -r '.sources | to_entries[] | select(.value.status != "current") | .key' "$manifest" \
                    || echo "$run manifest unreadable"
                fi
              done | sort -u | paste -sd, - | sed 's/,/, /g')
            if [ -n "$uncompared" ]; then
              attention=yes
              upgrade=no
              echo
              echo "Not compared, because generation failed in the control or candidate run: $uncompared. The reports in the artifact say why."
            fi
            if [ "$RESOLVE" != success ]; then
              echo
              echo '<details><summary>Resolution log</summary>'
              echo
              echo '~~~'
              tail -n 40 "$RUNNER_TEMP/resolve.log"
              echo '~~~'
              echo '</details>'
            fi
            for part in versions exclusions diff; do
              if [ -s "$RUNNER_TEMP/$part.md" ]; then
                echo
                cat "$RUNNER_TEMP/$part.md"
              fi
            done
          } > "$report"
          if [ "$upgrade" = yes ]; then
            printf '\nNothing checked changed, so the upgrade is proposed as a pull request.\n' >> "$report"
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          { echo "attention=$attention"; echo "upgrade=$upgrade"; } >> "$GITHUB_OUTPUT"

      - name: Upload canary results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-canary
          path: |
            ${{ runner.temp }}/canary/report.md
            ${{ runner.temp }}/resolve.log
            ${{ runner.temp }}/candidate/reports/
            ${{ runner.temp }}/control/reports/
            pdm.lock
          if-no-files-found: warn

      - name: Upload the proposed upgrade
        if: steps.summary.outputs.upgrade == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-upgrade
          path: |
            ${{ runner.temp }}/upgrade/pyproject.toml
            ${{ runner.temp }}/upgrade/pdm.lock
          if-no-files-found: error

  # Installs nothing, runs no repository code, and publishes no text produced
  # by the canary job; the details stay in that job's summary and artifact.
  report:
    needs: canary
    if: always() && needs.canary.outputs.attention != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Track the result in an issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ATTENTION: ${{ needs.canary.outputs.attention }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$ATTENTION" in
            yes|no) ;;
            *) echo "Unexpected canary result" >&2; exit 1 ;;
          esac
          title='Dependency canary'
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ "$ATTENTION" = yes ]; then
            printf '%s\n' "The latest dependency canary found changes or failures: $RUN_URL" "" \
              "Its job summary lists converter versions, test and generation outcomes, exclusion changes, and rule differences; the dependency-canary artifact holds the reports and resolved lock." \
              > issue.md
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file issue.md
            else
              gh issue create --title "$title" --body-file issue.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Dependencies match the published release again: $RUN_URL"
          fi

  # Proposes a drop-in upgrade. It runs only this branch's standard-library
  # checker with the runner's Python, never the resolved packages, and the pull
  # request shows only versions read from the checked lock.
  upgrade-pr:
    needs: canary
    if: needs.canary.outputs.upgrade == 'yes' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-upgrade
          path: ${{ runner.temp }}/upgrade

      - name: Open or update the upgrade pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch=deps/canary-upgrade
          for file in pyproject.toml pdm.lock; do
            if [ "$(stat -c %s "$RUNNER_TEMP/upgrade/$file")" -gt 1000000 ]; then
              echo "::error::The proposed $file is too large." && exit 1
            fi
          done
          python3 -I dependency_upgrade.py --check "$RUNNER_TEMP/upgrade" > "$RUNNER_TEMP/changes.md"
          marker="canary-lock: $(sha256sum "$RUNNER_TEMP/upgrade/pdm.lock" | cut -d' ' -f1)"
          # Only this repository's own pull requests from the bot count: a fork can
          # open one from a branch of the same name.
          ours='.[] | select((.isCrossRepository | not) and (.author.login | ltrimstr("app/")) == "github-actions")'
          # This exact lock was proposed before: open, merged, or rejected.
          if gh pr list --state all --head "$branch" --json body,isCrossRepository,author \
              --jq "$ours | .body" | grep -qF "$marker"; then
            echo "Already proposed: $marker"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            authors=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$branch" --jq '.commits[].commit.author.email')
            if [ -n "$authors" ] && grep -qvx '41898282+github-actions\[bot\]@users.noreply.github.com' <<< "$authors"; then
              echo "::warning::$branch has commits by people; it is left alone."
              exit 0
            fi
          fi
          git switch --quiet -C "$branch"
          cp "$RUNNER_TEMP/upgrade/pyproject.toml" "$RUNNER_TEMP/upgrade/pdm.lock" .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m 'Update dependencies the canary validated' -- pyproject.toml pdm.lock
          git push --quiet --force origin "$branch"
          {
            echo "The [dependency canary]($RUN_URL) reported that, with these versions, its tests passed and the published revisions regenerate with the same exclusions and rules. It ran unreviewed packages, so trust the checks on this branch, not that report."
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
            echo "Its checks run as a dispatched *Validate and publish Zircolite rules* run on \`$branch\`, which never publishes. Review the lock diff before merging."
            echo
            echo "<!-- $marker -->"
          } > "$RUNNER_TEMP/body.md"
          number=$(gh pr list --state open --head "$branch" --json number,isCrossRepository,author \
            --jq "[$ours | .number][0] // empty")
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$branch" --title 'Update dependencies the canary validated' \
              --body-file "$RUNNER_TEMP/body.md"
          fi
          # Pull requests and pushes made with this token start no workflow.
          gh workflow run Update.yml --ref "$branch"
