name: Deploy documentation site

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'experimental/README.md'
      - 'licenses/README.md'
      - 'index.html'
      - '_sidebar.md'
      - '.github/workflows/pages.yml'
  # The publish job pushes its commit with the workflow token, which starts no
  # workflow, so the site redeploys after every run instead.
  workflow_run:
    workflows: [Validate and publish Zircolite rules]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # On workflow_run this checks out the head of main, never the triggering run's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pages and figures only; links to rulesets and other files open on GitHub.
      - name: Assemble the site
        env:
          SITE: ${{ runner.temp }}/site
        run: |
          mkdir -p "$SITE/docs" "$SITE/experimental" "$SITE/licenses"
          cp index.html _sidebar.md README.md "$SITE/"
          cp docs/*.md "$SITE/docs/"
          cp -R docs/assets "$SITE/docs/"
          cp experimental/README.md "$SITE/experimental/"
          cp licenses/README.md "$SITE/licenses/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
