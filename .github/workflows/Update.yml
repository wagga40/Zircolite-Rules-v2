name: Validate and publish Zircolite rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'tests/**'
      - 'sources.json'
      - 'exclusions.json'
      - 'pyproject.toml'
      - 'pdm.lock'
      - '.github/workflows/Update.yml'
  pull_request:
  schedule:
    - cron: '23 1 * * *'

permissions:
  contents: read

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rules-gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.14'
          version: '2.29.2'

      - name: Install locked dependencies
        run: |
          pdm lock --check
          pdm sync --no-self -G test

      - name: Build minimum supported SQLite
        run: |
          curl --fail --location https://www.sqlite.org/2022/sqlite-amalgamation-3380000.zip --output /tmp/sqlite-min.zip
          unzip -q /tmp/sqlite-min.zip -d /tmp
          cc -O2 -DSQLITE_THREADSAFE=0 /tmp/sqlite-amalgamation-3380000/shell.c /tmp/sqlite-amalgamation-3380000/sqlite3.c -lm -ldl -o /tmp/sqlite-min
          echo "SQLITE_MIN_BINARY=/tmp/sqlite-min" >> "$GITHUB_ENV"

      - name: Test generation and release isolation
        id: tests
        run: pdm run pytest -q

      - name: Verify checked-in artifacts and README statistics
        if: github.event_name == 'pull_request'
        run: pdm run python gen_ruleset.py --verify-release

      - name: Generate validated sources
        id: generate
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          # Each source is staged and validated before promotion. Preserve a
          # partial failure so successful sources publish before the job fails.
          result=0
          pdm run python gen_ruleset.py || result=$?
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Upload validation reports
        if: always() && steps.generate.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: conversion-reports
          path: |
            reports/
            release-manifest.json
          if-no-files-found: warn

      - name: Publish successful sources and source status
        if: steps.generate.outcome == 'success' && github.event_name != 'pull_request'
        shell: bash
        run: |
          pdm run python gen_ruleset.py --verify-release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'rules_*.json' experimental/ licenses/ provenance/ reports/ release-manifest.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated rulesets'
            git push
          fi

      - name: Report failed sources
        if: steps.generate.outputs.result != '' && steps.generate.outputs.result != '0'
        run: |
          echo 'Some sources failed validation. Their previous rulesets were retained; inspect the reports artifact.' >&2
          exit 1
