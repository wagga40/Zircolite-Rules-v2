name: Validate and publish Zircolite rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'tests/**'
      - 'sources.json'
      - 'exclusions.json'
      - 'pyproject.toml'
      - 'pdm.lock'
      - '.github/workflows/Update.yml'
  pull_request:
  schedule:
    - cron: '23 1 * * *'

permissions: {}

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: false

env:
  # SHA3-256 published on sqlite.org's download page for this release.
  SQLITE_MIN_URL: https://www.sqlite.org/2022/sqlite-amalgamation-3380000.zip
  SQLITE_MIN_SHA3_256: d167634332b6875d8430f2ad1eda4e0b847b266c4fd7673c91b36644da00d02d

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: '3.14'
          version: '2.29.2'

      - name: Install locked dependencies
        run: |
          pdm lock --check
          pdm sync --no-self -G test

      - name: Build minimum supported SQLite
        run: |
          curl --fail --location --retry 3 "$SQLITE_MIN_URL" --output /tmp/sqlite-min.zip
          actual=$(openssl dgst -sha3-256 -r /tmp/sqlite-min.zip | cut -d' ' -f1)
          if [ "$actual" != "$SQLITE_MIN_SHA3_256" ]; then
            echo "SQLite archive checksum mismatch: $actual" >&2
            exit 1
          fi
          unzip -q /tmp/sqlite-min.zip -d /tmp
          cc -O2 -DSQLITE_THREADSAFE=0 /tmp/sqlite-amalgamation-3380000/shell.c /tmp/sqlite-amalgamation-3380000/sqlite3.c -lm -ldl -o /tmp/sqlite-min
          echo "SQLITE_MIN_BINARY=/tmp/sqlite-min" >> "$GITHUB_ENV"

      - name: Test generation and release isolation
        run: pdm run pytest -q

      # The publish job verifies main itself, after generating.
      - name: Verify checked-in artifacts and README statistics
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: pdm run python gen_ruleset.py --verify-release

      # Which published failures a change to exclusions.json approves or no
      # longer approves; review it alongside the records themselves.
      - name: Summarize approval changes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:exclusions.json > "$RUNNER_TEMP/base-exclusions.json"
          pdm run python exclusion_baseline.py reports --compare "$RUNNER_TEMP/base-exclusions.json" >> "$GITHUB_STEP_SUMMARY"

  # Only main publishes: a run dispatched on another branch would otherwise
  # commit rules there and edit the main tracking issue.
  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: '3.14'
          version: '2.29.2'

      # Sources are downloaded fresh: a restored Actions cache could be written
      # by any default-branch job, and this job can push rulesets.
      - name: Install locked dependencies
        run: pdm sync --no-self

      - name: Keep the published release for comparison
        run: git worktree add --detach "$RUNNER_TEMP/published" HEAD

      - name: Generate validated sources
        id: generate
        shell: bash
        run: |
          # Each source is staged and validated before promotion. A source that
          # fails keeps its previous rules (exit 3) while the others publish;
          # any other non-zero status is a crash, reported after publishing.
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_OUTPUT"
          # Upstream text reaches this log, so it must not run workflow commands.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          result=0
          pdm run python gen_ruleset.py || result=$?
          echo "::$token::"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Upload validation reports
        if: always() && steps.generate.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conversion-reports
          path: |
            reports/
            release-manifest.json
          if-no-files-found: warn

      # Also on a clean run: rules edited upstream that fail as reviewed still
      # publish, and only this step warns that their records need a re-pin.
      - name: Summarize failed sources
        id: summarize
        if: always() && steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SINCE: ${{ steps.generate.outputs.started }}
        run: >-
          pdm run python failure_report.py --run-url "$RUN_URL" --since "$SINCE"
          --summary "$GITHUB_STEP_SUMMARY" --issue "$RUNNER_TEMP/failures.md"

      - name: Summarize ruleset changes
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        run: pdm run python ruleset_diff.py "$RUNNER_TEMP/published" . >> "$GITHUB_STEP_SUMMARY"

      # For sources validated in this run only: re-pin the records of rules
      # edited upstream that still fail as reviewed, and drop records whose rule
      # no longer fails. Anything that would change an approval is refused.
      - name: Re-pin and prune reviewed exclusions
        id: exclusions
        if: steps.generate.outputs.result == '0' || steps.generate.outputs.result == '3'
        continue-on-error: true
        shell: bash
        run: |
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          status=0
          pdm run python exclusion_baseline.py reports --validated-only --apply > "$RUNNER_TEMP/exclusions.md" || status=$?
          echo "::$token::"
          if ! git diff --quiet -- exclusions.json; then
            { echo '## Exclusions updated for validated sources'; echo; cat "$RUNNER_TEMP/exclusions.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Publish successful sources and source status
        if: steps.generate.outcome == 'success'
        shell: bash
        run: |
          pdm run python gen_ruleset.py --verify-release
          # Nothing validated is almost always the network or the toolchain, not
          # upstream: keep the published state and let the outcome step fail.
          if ! jq -e 'any(.sources[]; .status == "current")' release-manifest.json > /dev/null; then
            echo 'No source validated; nothing to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'rules_*.json' experimental/ licenses/ provenance/ reports/ release-manifest.json README.md docs/dashboard.md docs/assets/ exclusions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated rulesets'
            git push
          fi

      - name: Track failed sources in an issue
        id: track
        if: always() && steps.generate.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.generate.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Rule source validation failures'
          body="$RUNNER_TEMP/failures.md"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ "$RESULT" = 0 ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "All sources validated in $RUN_URL."
            fi
          elif [ -s "$body" ]; then
            if [ -z "$number" ]; then
              gh issue create --title "$title" --body-file "$body"
            else
              # An edited description notifies nobody, so comment when the failures
              # change. Commenting first means a failed edit repeats the comment
              # next run rather than losing it.
              old=$(gh issue view "$number" --json body --jq .body | grep -o 'failure-fingerprint: [0-9a-f]*' || true)
              if [ "$old" != "$(grep -o 'failure-fingerprint: [0-9a-f]*' "$body")" ]; then
                gh issue comment "$number" --body "The failing sources changed in $RUN_URL; the description lists them."
              fi
              gh issue edit "$number" --body-file "$body"
            fi
          elif [ "$RESULT" = 3 ]; then
            echo '::error::Sources failed, but no issue body was written; see the Summarize failed sources step.'
            exit 1
          fi

      # Ends the run: green when some sources kept their previous rules and the
      # issue records them; red on a crash, when no source validated, or when
      # that feedback was lost.
      - name: Report the outcome
        if: >-
          ${{ !cancelled() && steps.generate.outputs.result != '' &&
          (steps.generate.outputs.result != '0' || steps.track.outcome == 'failure' ||
          steps.summarize.outcome == 'failure' || steps.exclusions.outcome == 'failure') }}
        env:
          EXCLUSIONS: ${{ steps.exclusions.outcome }}
          RESULT: ${{ steps.generate.outputs.result }}
          SUMMARIZED: ${{ steps.summarize.outcome }}
          TRACKED: ${{ steps.track.outcome }}
        run: |
          if [ "$EXCLUSIONS" = failure ]; then
            echo '::warning title=Exclusions not updated::Records of edited or fixed rules were not re-pinned or pruned; see the Re-pin and prune reviewed exclusions log.'
          fi
          if [ "$RESULT" = 0 ]; then
            if [ "$TRACKED" != success ]; then
              echo '::warning title=Issue not closed::Every source validated, but the tracking issue could not be closed; see the Track failed sources in an issue log.'
            fi
            if [ "$SUMMARIZED" != success ]; then
              echo '::warning title=Summary incomplete::Every source validated, but the check for exclusions that need a re-pin did not finish; see the Summarize failed sources log.'
            fi
            exit 0
          fi
          if [ "$RESULT" != 3 ]; then
            echo "::error title=Generation stopped::gen_ruleset.py exited with status $RESULT; its traceback is in the Generate validated sources log."
            exit 1
          fi
          if [ "$TRACKED" != success ]; then
            echo '::error title=Failed sources untracked::Some sources kept their previous rules, but the tracking issue was not updated; see the job summary and the Track failed sources in an issue log.'
            exit 1
          fi
          if ! jq -e 'any(.sources[]; .status == "current")' release-manifest.json > /dev/null; then
            echo '::error title=No source validated::Every source kept its previous rules, so nothing was committed; the tracking issue lists the failures.'
            exit 1
          fi
          if [ "$SUMMARIZED" != success ]; then
            echo '::warning title=Summary incomplete::The job summary may lack the failures or the exclusion baseline; see the Summarize failed sources log.'
          fi
          echo 'Some sources kept their previous rules; the warnings, job summary, and tracking issue list them.'
