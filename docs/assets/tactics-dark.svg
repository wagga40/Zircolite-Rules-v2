<title id="title">ATT&amp;CK tactics</title>
<desc id="desc">Unique detections in rules_windows_all.json per tactic; a rule can have several. Reconnaissance: 14; Resource Development: 28; Initial Access: 144; Execution: 1,129; Persistence: 811; Privilege Escalation: 661; Defense Evasion: 230; Defense Impairment: 343; Stealth: 933; Credential Access: 354; Discovery: 206; Lateral Movement: 206; Collection: 83; Command and Control: 941; Exfiltration: 68; Impact: 112; (no tactic tag): 358.</desc>
<style>
text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0efec; }
.secondary { fill: #c3c2b7; }
.muted { fill: #898781; }
.rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) backwards; }
.grow { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.2,.7,.2,1) backwards; }
.fade { animation: fade .5s ease-out backwards; }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
.draw { stroke-dasharray: 1; animation: draw .6s cubic-bezier(.2,.7,.2,1) backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes draw { from { stroke-dashoffset: 1; } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes fade { from { opacity: 0; } }
@keyframes pulse { from { opacity: .5; transform: scale(1); } to { opacity: 0; transform: scale(2.8); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
