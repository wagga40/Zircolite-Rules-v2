<title id="title">Zircolite rules overview</title>
<desc id="desc">12 of 13 sources current; 7,344 rules in rules_windows_all.json (4,696 unique); 299 Linux rules; 31 experimental correlations; updated 2026-10-13. Severity of unique detections: informational 114, low 351, medium 2,078, high 1,867, critical 290.</desc>
<style>
