<svg xmlns="http://www.w3.org/2000/svg" width="860" height="294" viewBox="0 0 860 294" role="img" aria-labelledby="title desc">
<title id="title">How a rule is published</title>
<desc id="desc">How a rule is published, daily at 01:23 UTC: 13 sources are fetched at pinned commits; 6,171 Sigma documents are read and 60 other files skipped; rules are converted for 4 profiles and every query is prepared in SQLite; 158 rules are left out, 38 by policy and 120 after review; 4,696 Windows detections, 299 Linux rules and 31 correlations are published, and 7,344 entries are combined in rules_windows_all.json. A source with an unreviewed failure keeps its last good rules; 1 of 13 are stale.</desc>
<style>
text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0b0b0b; }
.secondary { fill: #52514e; }
.muted { fill: #898781; }
.rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) backwards; }
.grow { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.2,.7,.2,1) backwards; }
.fade { animation: fade .5s ease-out backwards; }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
.draw { stroke-dasharray: 1; animation: draw .6s cubic-bezier(.2,.7,.2,1) backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes draw { from { stroke-dashoffset: 1; } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes fade { from { opacity: 0; } }
@keyframes pulse { from { opacity: .5; transform: scale(1); } to { opacity: 0; transform: scale(2.8); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<style>@keyframes flow { 0% { opacity: 0; } 5.0% { opacity: 1; } 10.0%, 100% { opacity: 0; } } .flow { opacity: 0; animation: flow 7000ms ease-in-out infinite; } @keyframes held { 0% { opacity: 0; } 5.0% { opacity: 1; } 10.0%, 100% { opacity: 0; } } .held { opacity: 0; animation: held 7000ms ease-in-out infinite; }</style>
<rect x="0.5" y="0.5" width="859" height="293" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="24" y="36" font-size="16" font-weight="600">How a rule is published</text>
<text x="24" y="56" font-size="12" class="secondary">Every source, daily at 01:23 UTC. Counts from the current release; one rule can yield several entries.</text>
<g class="rise" style="animation-delay:100ms"><rect x="24" y="84" width="116" height="104" rx="8" fill="#fcfcfb" stroke="#e1e0d9"/><text x="36" y="105" font-size="12" class="secondary">Fetch</text><text x="36" y="130" font-size="18" font-weight="600">13</text><text x="36" y="149" font-size="11" class="secondary">sources, each at</text><text x="36" y="163" font-size="11" class="secondary">a pinned commit</text></g>
<g class="rise" style="animation-delay:260ms"><rect x="152" y="84" width="116" height="104" rx="8" fill="#fcfcfb" stroke="#e1e0d9"/><text x="164" y="105" font-size="12" class="secondary">Read</text><text x="164" y="130" font-size="18" font-weight="600">6,171</text><text x="164" y="149" font-size="11" class="secondary">Sigma documents,</text><text x="164" y="163" font-size="11" class="secondary">60 others skipped</text></g>
<path class="draw" style="animation-delay:340ms" pathLength="1" d="M140.0 136.0L152.0 136.0" stroke="#898781" stroke-width="1.5" fill="none"/><path class="fade" style="animation-delay:740ms" d="M152.0 136.0L145.0 132.0L145.0 140.0Z" fill="#898781"/>
<g class="rise" style="animation-delay:420ms"><rect x="280" y="84" width="116" height="104" rx="8" fill="#fcfcfb" stroke="#e1e0d9"/><text x="292" y="105" font-size="12" class="secondary">Convert</text><text x="292" y="130" font-size="18" font-weight="600">4 profiles</text><text x="292" y="149" font-size="11" class="secondary">queries prepared</text><text x="292" y="163" font-size="11" class="secondary">in SQLite</text></g>
<path class="draw" style="animation-delay:500ms" pathLength="1" d="M268.0 136.0L280.0 136.0" stroke="#898781" stroke-width="1.5" fill="none"/><path class="fade" style="animation-delay:900ms" d="M280.0 136.0L273.0 132.0L273.0 140.0Z" fill="#898781"/>
<g class="rise" style="animation-delay:580ms"><rect x="408" y="84" width="116" height="104" rx="8" fill="#fcfcfb" stroke="#e1e0d9"/><text x="420" y="105" font-size="12" class="secondary">Left out</text><text x="420" y="130" font-size="18" font-weight="600">158</text><text x="420" y="149" font-size="11" class="secondary">38 by policy</text><text x="420" y="163" font-size="11" class="secondary">120 after review</text></g>
<path class="draw" style="animation-delay:660ms" pathLength="1" d="M396.0 136.0L408.0 136.0" stroke="#898781" stroke-width="1.5" fill="none"/><path class="fade" style="animation-delay:1060ms" d="M408.0 136.0L401.0 132.0L401.0 140.0Z" fill="#898781"/>
<g class="rise" style="animation-delay:740ms"><rect x="536" y="84" width="116" height="104" rx="8" fill="#fcfcfb" stroke="#e1e0d9"/><text x="548" y="105" font-size="12" class="secondary">Publish</text><text x="548" y="130" font-size="18" font-weight="600">4,696</text><text x="548" y="149" font-size="11" class="secondary">Windows rules</text><text x="548" y="163" font-size="11" class="secondary">+299 Linux</text><text x="548" y="177" font-size="11" class="secondary">+31 correlations</text></g>
<path class="draw" style="animation-delay:820ms" pathLength="1" d="M524.0 136.0L536.0 136.0" stroke="#898781" stroke-width="1.5" fill="none"/><path class="fade" style="animation-delay:1220ms" d="M536.0 136.0L529.0 132.0L529.0 140.0Z" fill="#898781"/>
<g class="rise" style="animation-delay:900ms"><rect x="664" y="84" width="172" height="104" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/><text x="676" y="105" font-size="12" class="secondary">Combine</text><text x="676" y="130" font-size="18" font-weight="600">7,344</text><text x="676" y="149" font-size="11" class="secondary">entries in</text><text x="676" y="163" font-size="11" class="secondary">rules_windows_all.json</text></g>
<path class="draw" style="animation-delay:980ms" pathLength="1" d="M652.0 136.0L664.0 136.0" stroke="#898781" stroke-width="1.5" fill="none"/><path class="fade" style="animation-delay:1380ms" d="M664.0 136.0L657.0 132.0L657.0 140.0Z" fill="#898781"/>
<path class="fade" style="animation-delay:1200ms" d="M466.0 188.0L466.0 222.0" stroke="#898781" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/><path class="fade" style="animation-delay:1600ms" d="M466.0 222.0L462.0 215.0L470.0 215.0Z" fill="#898781"/>
<g class="rise" style="animation-delay:1300ms"><rect x="408" y="222" width="428" height="48" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-dasharray="4 4"/><text x="420" y="242" font-size="12">Unreviewed failure: the source keeps its last good rules</text><text x="420" y="259" font-size="11" class="secondary">1 of 13 sources stale now</text></g>
<rect class="flow" style="animation-delay:2400ms" x="24" y="84" width="116" height="104" rx="8" fill="none" stroke="#2a78d6" stroke-width="2"/>
<rect class="flow" style="animation-delay:2750ms" x="152" y="84" width="116" height="104" rx="8" fill="none" stroke="#2a78d6" stroke-width="2"/>
<rect class="flow" style="animation-delay:3100ms" x="280" y="84" width="116" height="104" rx="8" fill="none" stroke="#2a78d6" stroke-width="2"/>
<rect class="flow" style="animation-delay:3450ms" x="408" y="84" width="116" height="104" rx="8" fill="none" stroke="#2a78d6" stroke-width="2"/>
<rect class="flow" style="animation-delay:3800ms" x="536" y="84" width="116" height="104" rx="8" fill="none" stroke="#2a78d6" stroke-width="2"/>
<rect class="flow" style="animation-delay:4150ms" x="664" y="84" width="172" height="104" rx="8" fill="none" stroke="#2a78d6" stroke-width="2"/>
<rect class="held" style="animation-delay:3800ms" x="408" y="222" width="428" height="48" rx="8" fill="none" stroke="#fab219" stroke-width="2"/>
</svg>
