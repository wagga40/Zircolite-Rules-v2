<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zircolite rules</title>
  <meta name="description" content="Validated Sigma rulesets for Zircolite">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/themes/core.min.css" integrity="sha384-EHVG4GyaSD3YEuLBkKV9+uYAxVxDbhmNuPVXRdvHjrC0+eLbs8F7fFiR2aeuXY5S" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/themes/addons/vue.min.css" integrity="sha384-7UrCrrJrgccq8N0pbtJyi5KxBhdfCP2BMFFGJmHJqlnmKGdPL1W82xz4a2eegGRU" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/themes/addons/core-dark.min.css" media="(prefers-color-scheme: dark)" integrity="sha384-0nrMf7u5/wUF0pWYWts1RzfUixk93lq2QuCgzLlH5YIAjqgIqoaZq4H4tuYp1k60" crossorigin="anonymous">
  <style>
    /* Keep prose and the full-width figures in one responsive column. */
    :root {
      --content-max-width: 960px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // Pages live where they do in the repository, so links written for GitHub work here too.
    function repoPaths(hook, vm) {
      var blob = 'https://github.com/wagga40/Zircolite-Rules-v2/blob/main/';
      hook.afterEach(function (html, next) {
        var file = vm.route.file || 'README.md';
        var dir = file.slice(0, file.lastIndexOf('/') + 1);
        // Raw-HTML figures (<picture>) are relative to the page's folder, not the site root.
        html = html.replace(/\b(src|srcset)="(?![a-z]+:|\/|#)([^"]+)"/g, function (_, attr, path) {
          return attr + '="' + dir + path + '"';
        });
        // relativePath compiles ../rules_linux.json to #/rules_linux.json; only .md files are pages.
        html = html.replace(/href="#\/([^"?#]+\.(?!md")[a-z0-9]+)"/gi, function (_, path) {
          return 'href="' + blob + path + '" target="_blank" rel="noopener"';
        });
        next(html);
      });
    }

    function renderMermaid(hook) {
      var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default' });
      hook.doneEach(function () {
        mermaid.run({ querySelector: '.mermaid' });
      });
    }

    function escapeHtml(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    window.$docsify = {
      name: 'Zircolite rules',
      repo: 'wagga40/Zircolite-Rules-v2',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },  // one sidebar, no 404 per folder
      relativePath: true,                             // links resolve from the page, as on GitHub
      subMaxLevel: 2,
      auto2top: true,
      search: { placeholder: 'Search', noData: 'No results', depth: 3 },
      markdown: {
        renderer: {
          code: function (token) {
            if (token.lang === 'mermaid') {
              return '<div class="mermaid">' + escapeHtml(token.text) + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [repoPaths, renderMermaid]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/docsify.min.js" integrity="sha384-hx+mDRaRp2tw2tlDV9AVMMkU5zRLpaEIGGYt3k1ZiWSxGxIzCyP3FceVHUAMb1bI" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/plugins/search.min.js" integrity="sha384-mkjQDRnwrfyRbChj7+qlTfCEvrsSsxs6VVslNDhuufsMKuF4STph3BezVwzTknga" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js" integrity="sha384-9WmlN8ABpoFSSHvBGGjhvB3E/D8UkNB9HpLJjBQFC2VSQsM1odiQDv4NbEo+7l15" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@12.3.0/dist/mermaid.min.js" integrity="sha384-HHW54r639fK42Ip0coGF3mz8oSiGn0eEoWNTLs75X7H63pLSDBa0Tqs0RwGmLlXE" crossorigin="anonymous"></script>
</body>
</html>
