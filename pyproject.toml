[project]
name = "Zircolite-Rules-v2"
version = "0.1.0"
description = "Validated Sigma rulesets for Zircolite"
authors = [
    {name = "wagga40", email = "6437862+wagga40@users.noreply.github.com"},
]
dependencies = [
    "pysigma-backend-sqlite==2.0.0",
    "pysigma>=1.5.1,<2",
    "pysigma-pipeline-windows==2.0.0",
    "pysigma-pipeline-sysmon==2.0.0",
    "PyYAML>=6.0.3,<7",
    "requests>=2.32.5,<3",
]
requires-python = "==3.14.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[dependency-groups]
test = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
