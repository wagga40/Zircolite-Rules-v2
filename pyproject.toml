[project]
name = "Zircolite-Rules-v2"
version = "0.1.0"
description = "Validated Sigma rulesets for Zircolite"
authors = [
    {name = "wagga40", email = "6437862+wagga40@users.noreply.github.com"},
]
dependencies = [
    "pysigma-backend-sqlite==2.1.1",
    "pysigma>=2.0.1,<3",
    "pysigma-pipeline-windows==2.0.0",
    "pysigma-pipeline-sysmon==2.0.0",
    "PyYAML>=6.0.3,<7",
    "requests>=2.32.5,<3",
]
requires-python = "==3.14.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

# Shortcuts for docs/maintenance.md; extra arguments are appended, as in `pdm run audit --sources tsale`.
[tool.pdm.scripts]
test = {cmd = "pytest -q", help = "Run the tests; set SQLITE_MIN_BINARY to a SQLite 3.38 CLI to run its tests too"}
generate = {cmd = "python gen_ruleset.py", help = "Fetch, validate, and publish every source"}
verify = {cmd = "python gen_ruleset.py --verify-release", help = "Check published hashes, counts, the README, dashboard, and figures"}
stats = {cmd = "python gen_ruleset.py --update-readme-stats", help = "Refresh the README summary, dashboard, and figures"}
audit = {cmd = "python gen_ruleset.py --audit --revisions-from release-manifest.json --output-dir build/audit", help = "Report on the published revisions without publishing"}
repro = {cmd = "python gen_ruleset.py --revisions-from release-manifest.json --output-dir build/repro", help = "Regenerate the published revisions into build/repro"}
diff = {cmd = "python ruleset_diff.py . build/repro", help = "Compare the release with build/repro rule by rule"}
baseline = {cmd = "python exclusion_baseline.py build/audit/reports", help = "Propose exclusion updates from the audit"}
draft = {cmd = "python exclusion_baseline.py build/audit/reports --draft-new", help = "Draft records for the audit's new failures"}
prune-cache = {cmd = "python gen_ruleset.py --prune-cache", help = "Remove cached snapshots the release no longer uses"}
check = {composite = ["test", "verify"], help = "Run the tests, then verify the release"}

# The Windows and Sysmon pipeline releases still declare pysigma<2 but work
# unchanged on pySigma 2. Remove once these pull requests are released:
# https://github.com/SigmaHQ/pySigma-pipeline-windows/pull/15
# https://github.com/SigmaHQ/pySigma-pipeline-sysmon/pull/15
[tool.pdm.resolution.overrides]
pysigma = ">=2.0.1,<3"

[dependency-groups]
test = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
